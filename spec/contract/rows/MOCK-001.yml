id: MOCK-001
title: A mock named with a mock suffix as well as a prefix
modes: [none, tests]
legs:
  cmock:
    note: CMock writes the mock
  fff:
    plugins: [fff]
    note: The FFF plugin writes the mock as a fake
tree:
  src/drivers/foox.h: |
    #ifndef FOOX_H
    #define FOOX_H
    int foox_read(void);
    #endif
  src/drivers/foox.c: |
    #include "foox.h"
    int foox_read(void) { return 1; }
  test/test_foox.c: |
    #include "unity.h"
    #include "drivers/mock_foox_sfx.h"
    void setUp(void) {}
    void tearDown(void) {}
    void test_mocked(void) { TEST_ASSERT_EQUAL(0, 0); }
project:
  :paths:
    :include: [src]
  :cmock:
    :mock_prefix: mock_
    :mock_suffix: _sfx
target:
  none/cmock:
    - outcome:
        status: pass
      resolved:
        test/test_foox.c "drivers/mock_foox_sfx.h": src/drivers/foox.h
      link_set:
        build/test/out/test/test_foox/_t_/test_foox%{exe}:
          - test/test_foox.c
          - build/test/mocks/test/test_foox/_t_/drivers/mock_foox_sfx.c
          - build/test/runners/test/test_foox_runner.c
          - build/vendor/unity/src/unity.c
          - build/vendor/cmock/src/cmock.c
  none/fff:
    - outcome:
        status: pass
      resolved:
        test/test_foox.c "drivers/mock_foox_sfx.h": src/drivers/foox.h
      link_set:
        build/test/out/test/test_foox/_t_/test_foox%{exe}:
          - test/test_foox.c
          - build/test/mocks/test/test_foox/_t_/drivers/mock_foox_sfx.c
          - build/test/runners/test/test_foox_runner.c
          - build/vendor/unity/src/unity.c
          - build/vendor/cmock/src/cmock.c
  tests/cmock:
    - outcome:
        status: pass
      resolved:
        test/test_foox.c "drivers/mock_foox_sfx.h": src/drivers/foox.h
      link_set:
        build/test/out/test/test_foox/_t_/test_foox%{exe}:
          - test/test_foox.c
          - build/test/mocks/test/test_foox/_t_/drivers/mock_foox_sfx.c
          - build/test/runners/test/test_foox_runner.c
          - build/vendor/unity/src/unity.c
          - build/vendor/cmock/src/cmock.c
  tests/fff:
    - outcome:
        status: pass
      resolved:
        test/test_foox.c "drivers/mock_foox_sfx.h": src/drivers/foox.h
      link_set:
        build/test/out/test/test_foox/_t_/test_foox%{exe}:
          - test/test_foox.c
          - build/test/mocks/test/test_foox/_t_/drivers/mock_foox_sfx.c
          - build/test/runners/test/test_foox_runner.c
          - build/vendor/unity/src/unity.c
          - build/vendor/cmock/src/cmock.c
