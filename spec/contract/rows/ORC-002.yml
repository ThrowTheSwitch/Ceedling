id: ORC-002
title: Windows separators in the .d file and line markers under -I .
platforms: [windows]
platform_note: Only Windows compilers write backslash separators
modes: [none]
legs:
  gcc:
    note: MinGW GCC, the runner's gcc
  clang:
    cc: clang
    note: Clang, where the runner has it
    project:
      :tools_test_compiler:
        :executable: clang
      :tools_test_linker:
        :executable: clang
tree:
  src/drivers/bar.h: |
    #ifndef BAR_H
    #define BAR_H
    #include "foo.h"
    #define BAR_K FOO_K
    #endif
  src/drivers/foo.h: |
    #ifndef FOO_H
    #define FOO_H
    #define FOO_K 3
    #endif
  test/test_dot.c: |
    #include "unity.h"
    #include "src/drivers/bar.h"
    void setUp(void) {}
    void tearDown(void) {}
    void test_dot(void) { TEST_ASSERT_EQUAL(3, BAR_K); }
project:
  :paths:
    :include: [.]
target: ~
