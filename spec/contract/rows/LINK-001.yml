id: LINK-001
title: A mocked .hpp header and the source that implements it
modes: [none, tests, all]
tree:
  src/drivers/foox.hpp: |
    #ifndef FOOX_HPP
    #define FOOX_HPP
    int foox_read(void);
    #endif
  src/drivers/foox.c: |
    #include "foox.hpp"
    int foox_read(void) { return 1; }
  test/test_foox.c: |
    #include "unity.h"
    #include "drivers/mock_foox.hpp"
    TEST_SOURCE_FILE("drivers/foox.c")
    void setUp(void) {}
    void tearDown(void) {}
    void test_mocked(void) { foox_read_ExpectAndReturn(7); TEST_ASSERT_EQUAL(7, foox_read()); }
project:
  :extension:
    :header: [.h, .hpp]
  :paths:
    :include: [src/**]
    :source: [src/**]
divergences:
  - at: resolved test/test_foox.c "drivers/mock_foox.hpp"
    kind: convention
    note: A mock include names the mocked header, which the compiler never sees
target:
  none:
    - outcome:
        status: pass
      resolved:
        test/test_foox.c "drivers/mock_foox.hpp": src/drivers/foox.hpp
      link_set:
        build/test/out/test/test_foox/_t_/test_foox%{exe}:
          - test/test_foox.c
          - build/test/mocks/test/test_foox/_t_/src/drivers/mock_foox.c
          - build/test/runners/test/test_foox_runner.c
          - build/vendor/unity/src/unity.c
          - build/vendor/cmock/src/cmock.c
  tests:
    - outcome:
        status: pass
      resolved:
        test/test_foox.c "drivers/mock_foox.hpp": src/drivers/foox.hpp
      link_set:
        build/test/out/test/test_foox/_t_/test_foox%{exe}:
          - test/test_foox.c
          - build/test/mocks/test/test_foox/_t_/src/drivers/mock_foox.c
          - build/test/runners/test/test_foox_runner.c
          - build/vendor/unity/src/unity.c
          - build/vendor/cmock/src/cmock.c
  all:
    - outcome:
        status: pass
      resolved:
        test/test_foox.c "drivers/mock_foox.hpp": src/drivers/foox.hpp
      link_set:
        build/test/out/test/test_foox/_t_/test_foox%{exe}:
          - test/test_foox.c
          - build/test/mocks/test/test_foox/_t_/src/drivers/mock_foox.c
          - build/test/runners/test/test_foox_runner.c
          - build/vendor/unity/src/unity.c
          - build/vendor/cmock/src/cmock.c
